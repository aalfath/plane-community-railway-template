; Upstream's supervisor.conf for the all-in-one image (v1.4.3), changed for
; Railway: every program logs to stdout (upstream writes to files under
; /app/logs), and the Celery worker count is capped by
; CELERY_WORKER_CONCURRENCY (upstream starts one per CPU the host has).
[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:migrator]
directory=/app/backend
command=sh -c "./bin/docker-entrypoint-migrator.sh"
autostart=true
autorestart=unexpected
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=10

[program:space]
directory=/app/space/apps/space
command=sh -c "exec ./node_modules/.bin/react-router-serve ./build/server/index.js"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=3002,HOSTNAME=0.0.0.0
priority=15

[program:api]
directory=/app/backend
command=sh -c "./bin/docker-entrypoint-api.sh"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=3004,HOSTNAME=0.0.0.0
priority=15

[program:worker]
directory=/app/backend
command=sh -c "python manage.py wait_for_db && python manage.py wait_for_migrations && exec celery -A plane worker -l info --concurrency ${CELERY_WORKER_CONCURRENCY:-2}"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20

[program:beat]
directory=/app/backend
command=sh -c "./bin/docker-entrypoint-beat.sh"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20

[program:live]
command=sh -c "exec node /app/live/apps/live"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PORT=3005,HOSTNAME=0.0.0.0
priority=20

[program:proxy]
directory=/app/proxy
command=sh -c "exec caddy run --config /app/proxy/Caddyfile"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20
